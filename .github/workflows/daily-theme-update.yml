name: WakaTime Daily Theme Update

on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Coding hours (for testing)'
        required: false
        default: ''
      theme:
        description: 'Theme name'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-theme:
    runs-on: ubuntu-latest
    
    # 强制使用 Node 24，减少警告
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Update WakaTime Files
        id: update
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
          TZ: 'Asia/Shanghai'
          MODEL_NAME: 'openai/gpt-4o-mini'
          MODEL_DEBUG: '1'
        run: node .github/scripts/update-wakatime.js

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add assets/json/config.js assets/json/weekly.js
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Update daily theme & weekly stats: ${{ steps.update.outputs.theme_name || 'auto' }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}