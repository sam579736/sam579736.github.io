name: WakaTime Daily Theme Update

on:
  schedule:
    # 北京时间每天 08:00 (UTC 00:00)
    - cron: '0 0 * * *'
  
  workflow_dispatch:
    inputs:
      hours:
        description: 'Manual coding hours (for testing)'
        required: false
        default: ''
      theme:
        description: 'Manual theme (rest/relaxed/productive/focused/intense/legendary)'
        required: false
        default: ''
  
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-theme-update.yml'

permissions:
  contents: write
  # models: read  # Remove unless you're actually using GitHub Models

jobs:
  update-theme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Better for commit history if needed

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'     # Optional: speeds up if you have package.json

      - name: Install dependencies
        run: npm ci --production=false   # or yarn, pnpm depending on your setup

      - name: Update WakaTime Files
        id: update
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
          MANUAL_HOURS: ${{ github.event.inputs.hours }}
          MANUAL_THEME: ${{ github.event.inputs.theme }}
          TZ: 'Asia/Shanghai'
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node .github/scripts/update-wakatime.js

      - name: Commit and Push
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            assets/json/config.js
            assets/json/weekly.js
          message: "Update daily theme & weekly stats: ${{ steps.update.outputs.theme_name || 'auto' }}"
          github_token: ${{ secrets.GH_TOKEN }}
          default_author: github-actions[bot]