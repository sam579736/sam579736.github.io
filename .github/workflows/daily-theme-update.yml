name: WakaTime Daily Theme Update

on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:
    inputs:
      hours: { description: 'Coding hours', required: false, default: '' }
      theme: { description: 'Theme name', required: false, default: '' }

permissions:
  contents: write

jobs:
  update-theme:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}   # 关键修改

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update WakaTime Files
        id: update
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
          TZ: 'Asia/Shanghai'
          MODEL_NAME: 'openai/gpt-4o-mini'
          MODEL_DEBUG: '1'
        run: node .github/scripts/update-wakatime.js

      - name: Commit and Push
        uses: EndBug/add-and-commit@v10
        with:
          add: 'assets/json/config.js assets/json/weekly.js'
          message: "Update daily theme & weekly stats: ${{ steps.update.outputs.theme_name || 'auto' }}"
          github_token: ${{ secrets.GITHUB_TOKEN }}   # ← 改成内置 token
          pull: true
          default_author: github_actions