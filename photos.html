<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>照片墙 - Sam Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="./assets/css/vno.css">
    <link rel="stylesheet" type="text/css" href="./assets/css/wakatime-theme.css">

    <style>
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .photo-item {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
            transition: all 0.3s;
        }
        .photo-item:hover {
            transform: scale(1.04);
        }
        .photo-item img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <header id="panel" class="panel-cover">
        <div class="panel-main">
            <div class="panel-main__inner panel-inverted">
                <div class="panel-main__content">
                    <h1 class="panel-cover__title"><a href="index.html">📸 Sam 的照片墙</a></h1>
                    <p class="panel-cover__subtitle">记录生活 · 留住瞬间</p>
                </div>
            </div>
        </div>
    </header>

    <div class="photo-grid" id="photoGrid"></div>

    <script>
        const photos = [
            "./photo/sfc_kirbyss.jpg",
            "./photo/sfc_kirbyssz.jpg"
        ];

        const grid = document.getElementById('photoGrid');
        
        photos.forEach(src => {
            const div = document.createElement('div');
            div.className = 'photo-item';
            div.innerHTML = `<img src="${src}" alt="Sam Photo" loading="lazy">`;
            grid.appendChild(div);
        });
    </script>

</body>
</html>
